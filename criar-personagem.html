<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="fichas.css">
    <link rel="stylesheet" href="responsivo.css">
    <link rel="stylesheet" href="criar-personagem.css">
    <link rel="stylesheet" href="padrao-acessibilidade.css">

    <title>Criar ficha</title>
    <link rel="stylesheet" href="navegacao-paginas.css">
    <link rel="stylesheet" href="menu-ajuste.css">
    <link rel="icon" type="image/png" sizes="512x512" href="img/favicon-making-rpg.png">
    <link rel="stylesheet" href="identidade-global.css">
</head>

<body>

    <div class="container">

        <div class="lateral"></div>

        <!-- LOGO -->
        <div class="logo">
            <a href="index.html">
                <img src="img/Cópia de MAKING RPG.png" alt="Making RPG - ir para a página inicial">
            </a>
        </div>


        <!-- MENU -->
        <header>
            <nav class="menu" aria-label="Menu principal">

                <button
                    class="menu-toggle"
                    id="menuToggle"
                    type="button"
                    aria-label="Abrir menu"
                    aria-expanded="false"
                    aria-controls="menuLista"
                >
                    <span class="icone-menu" aria-hidden="true">☰</span>
                    <span class="texto-menu">Menu</span>
                </button>

                <ul id="menuLista">

                    <li>
                        <a href="fichas.html" aria-current="page">Fichas</a>
                    </li>

                    <img src="img/decor_menu.png" class="decor" alt="">

                    <li>
                        <a href="campanhas.html">Campanhas</a>
                    </li>

                    <img src="img/decor_menu.png" class="decor" alt="">

                    <li>
                        <a href="mapas.html">Mapas</a>
                    </li>

                    <img src="img/decor_menu.png" class="decor" alt="">

                    <li>
                        <a href="missoes.html">Missões</a>
                    </li>

                </ul>

            </nav>
        </header>


        <!-- TÍTULO -->
        <h1>Criar ficha</h1>


        <!-- PASSO 1 -->
        <section id="passo-tipo">

            <p class="subtitulo">O que você quer criar?</p>

            <div class="opcoes">

                <button
                    class="opcao"
                    id="opcao-personagem"
                    type="button"
                >
                    <span class="opcao-titulo">Meu personagem</span>

                    <span class="opcao-descricao">
                        Crie um personagem seu para jogar uma sessão de RPG.
                    </span>
                </button>

                <button
                    class="opcao"
                    id="opcao-npc"
                    type="button"
                >
                    <span class="opcao-titulo">NPC</span>

                    <span class="opcao-descricao">
                        Crie um NPC para usar em uma campanha.
                    </span>
                </button>

            </div>

            <a class="bnt-fichas bnt-voltar" href="fichas.html">
                Voltar
            </a>

        </section>


        <!-- PASSO 2 -->
        <section id="passo-relacao" hidden>

            <p class="subtitulo">Esse NPC será aliado ou inimigo?</p>

            <div class="opcoes">

                <button
                    class="opcao opcao-aliado"
                    id="opcao-aliado"
                    type="button"
                >
                    <span class="opcao-titulo">Aliado</span>

                    <span class="opcao-descricao">
                        Um NPC que ajuda ou luta ao lado do grupo.
                    </span>
                </button>

                <button
                    class="opcao opcao-inimigo"
                    id="opcao-inimigo"
                    type="button"
                >
                    <span class="opcao-titulo">Inimigo</span>

                    <span class="opcao-descricao">
                        Um NPC que se opõe ao grupo.
                    </span>
                </button>

            </div>

            <button
                class="bnt-fichas bnt-voltar"
                id="voltar-tipo"
                type="button"
            >
                Voltar
            </button>

        </section>


    </div>


    <!-- JAVASCRIPT -->
    <script src="criar-personagem.js"></script>

    <script src="menu.js" defer></script>

    <!-- VLibras -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget(
            'https://vlibras.gov.br/app',
            'https://vlibras.gov.br/config/default_logo.json',
            'random',
            'R'
        );
    </script>

    <script src="navegacao-paginas.js" defer></script>

    <footer class="footer">
        <span>© 2026 Making RPG Project. Todos os direitos reservados.</span>
        <span class="footer__sep"><img src="img/decor_menu.png" alt=""></span>
        <a href="https://mail.google.com/mail/?view=cm&to=tccmakingrpgproject@gmail.com" target="_blank" rel="noopener">
            <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7l9 6 9-6"/>
            </svg>
            tccmakingrpgproject@gmail.com
        </a>
    </footer>

</body>

</html>
