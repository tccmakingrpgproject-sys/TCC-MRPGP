<!DOCTYPE html>
<html lang="pt-BR">

<head>

<body>

    <div class="container">

        <div class="lateral"></div>

        <div class="logo">
            <a href="index.html">
                <img src="img/Cópia de MAKING RPG.png"
                     alt="Making RPG - ir para a página inicial">
            </a>
        </div>

        <header>
            <nav class="menu" aria-label="Menu principal">

                <button class="menu-toggle" id="menuToggle" type="button"
                        aria-label="Abrir menu" aria-expanded="false"
                        aria-controls="menuLista">
                    <span class="icone-menu" aria-hidden="true">☰</span>
                    <span class="texto-menu">Menu</span>

                <ul id="menuLista">

                </ul>

            </nav>
        </header>

        <div class="titulo-pre">
            <h1>Mapas Pré-prontos</h1>
        </div>

        <main class="lista-predefinidos">

            <article
                class="card-predefinido botao-adicionar"
                role="button"
                tabindex="0"
                data-nome="Mapa 1"
                data-imagem="img/Mapa 1.jpeg"
            >

                <div class="imagem-mapa">
                    <img src="img/Mapa 1.jpeg"
                         alt="Imagem do mapa 1"
                         onerror="this.style.display='none'">
                </div>

                <h3 class="nome-predefinido">Mapa 1</h3>

            </article>


            <article
                class="card-predefinido botao-adicionar"
                role="button"
                tabindex="0"
                data-nome="Mapa 2"
                data-imagem="img/Mapa 2.jpeg"
            >

                <div class="imagem-mapa">
                    <img src="img/Mapa 2.jpeg"
                         alt="Imagem do mapa 2"
                         onerror="this.style.display='none'">
                </div>

                <h3 class="nome-predefinido">Mapa 2</h3>

            </article>


            <article
                class="card-predefinido botao-adicionar"
                role="button"
                tabindex="0"
                data-nome="Mapa 3"
                data-imagem="img/Mapa 3.jpeg"
            >

                <div class="imagem-mapa">
                    <img src="img/Mapa 3.jpeg"
                         alt="Imagem do mapa 3"
                         onerror="this.style.display='none'">
                </div>

                <h3 class="nome-predefinido">Mapa 3</h3>

            </article>

            'random',
            'R'
        );
    </script>

        <span class="footer__sep"><img src="img/decor_menu.png" alt=""></span>

            <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7l9 6 9-6"/>

            tccmakingrpgproject@gmail.com
