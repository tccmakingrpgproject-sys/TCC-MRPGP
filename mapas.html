<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="mapas.css">
    <link rel="stylesheet" href="padrao-acessibilidade.css">
    <link rel="stylesheet" href="responsivo.css">

    <title>Mapas</title>

    <link rel="stylesheet" href="menu-ajuste.css">
    <link rel="icon" type="image/png" sizes="512x512" href="img/favicon-making-rpg.png">
    <link rel="stylesheet" href="identidade-global.css">
</head>

<body>

    <div class="container">

        <div class="lateral"></div>

        <div class="logo">
            <a href="index.html">
                <img src="img/Cópia de MAKING RPG.png"
                     alt="Making RPG - ir para a página inicial">
            </a>
        </div>

        <header>
            <nav class="menu" aria-label="Menu principal">

                <button class="menu-toggle" id="menuToggle" type="button"
                        aria-label="Abrir menu" aria-expanded="false"
                        aria-controls="menuLista">
                    <span class="icone-menu" aria-hidden="true">☰</span>
                    <span class="texto-menu">Menu</span>
                </button>

                <ul id="menuLista">
                    <li><a href="fichas.html">Fichas</a></li>
                    <img src="img/decor_menu.png" class="decor" alt="">
                    <li><a href="campanhas.html">Campanhas</a></li>
                    <img src="img/decor_menu.png" class="decor" alt="">
                    <li><a href="mapas.html" aria-current="page">Mapas</a></li>
                    <img src="img/decor_menu.png" class="decor" alt="">
                    <li><a href="missoes.html">Missões</a></li>
                </ul>

            </nav>
        </header>

        <div class="titulo">
            <h1>Mapas</h1>
        </div>

        <main class="container-principal-mapas">

            <!-- LISTA DE MAPAS -->
            <section class="lista-mapas" id="listaMapas"></section>

            <!-- BOTÕES -->
            <div class="acoes-principais">

                <a href="inserir.html" class="botao-acao">inserir imagem</a>

                <a href="mapas-predefinidos.html" class="botao-acao">escolher mapa pronto</a>

            </div>

        </main>

        <!-- MODAL DE DETALHES -->
        <div class="modal-overlay" id="modalDetalhes">

            <div class="modal">

                <button class="fechar-modal" id="fecharModal" aria-label="Fechar">×</button>

                <h2 id="detalheNome"></h2>

                <input type="text" id="editarNome" class="editar-nome"
                       maxlength="60" aria-label="Nome do mapa" hidden>

                <div class="detalhes-conteudo">

                    <button type="button" class="detalhe-imagem-botao"
                            id="botaoAmpliar" aria-label="Ampliar imagem">
                        <img id="detalheImagem" class="detalhe-imagem" src="" alt="">
                        <span class="dica-ampliar">clique para ampliar</span>
                    </button>

                    <div class="detalhe-descricao" tabindex="0">
                        <p><strong>Descrição:</strong><span id="detalheDescricao"></span></p>
                    </div>

                    <div class="editar-bloco" id="blocoEditarDescricao" hidden>
                        <label for="editarDescricao" class="editar-rotulo">Descrição:</label>
                        <textarea id="editarDescricao" class="editar-campo"
                                  rows="5" maxlength="500"></textarea>
                    </div>

                </div>

                <div class="acoes-modal">
                    <button type="button" class="botao-edicao" id="botaoEditar">editar</button>
                    <span class="acoes-edicao" id="acoesEdicao" hidden>
                        <button type="button" class="botao-edicao" id="cancelarEdicao">cancelar</button>
                        <button type="button" class="botao-edicao principal" id="salvarEdicao">salvar</button>
                    </span>
                </div>

            </div>

        </div>

        <!-- IMAGEM AMPLIADA -->
        <div class="lightbox" id="lightbox" role="dialog"
             aria-modal="true" aria-label="Imagem ampliada">

            <button type="button" class="fechar-lightbox" id="fecharLightbox"
                    aria-label="Fechar imagem ampliada">×</button>

            <img id="imagemAmpliada" src="" alt="">

        </div>

        <div class="lateral"></div>

    </div>

    <script src="mapas.js"></script>
    <script src="menu.js" defer></script>

    <!-- VLibras -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget(
            'https://vlibras.gov.br/app',
            'https://vlibras.gov.br/config/default_logo.json',
            'random',
            'R'
        );
    </script>


    <footer class="footer">
        <span>© 2026 Making RPG Project. Todos os direitos reservados.</span>
        <span class="footer__sep"><img src="img/decor_menu.png" alt=""></span>
        <a href="https://mail.google.com/mail/?view=cm&to=tccmakingrpgproject@gmail.com" target="_blank" rel="noopener">
            <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7l9 6 9-6"/>
            </svg>
            tccmakingrpgproject@gmail.com
        </a>
    </footer>

</body>

</html>
