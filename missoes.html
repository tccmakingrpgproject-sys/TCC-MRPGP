<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="color-scheme" content="light only">

    <link
        rel="stylesheet"
        href="missoes.css"
    >
    <link rel="stylesheet" href="padrao-acessibilidade.css">
    <link rel="stylesheet" href="responsivo.css">

    <title>Missões</title>

    <link rel="stylesheet" href="menu-ajuste.css">
    <link rel="icon" type="image/png" sizes="512x512" href="img/favicon-making-rpg.png">
    <link rel="stylesheet" href="identidade-global.css">
</head>


<body>

    <!-- CONTAINER PRINCIPAL -->

    <div class="container">


        <!-- LATERAL ESQUERDA -->

        <div class="lateral"></div>


        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="img/Cópia de MAKING RPG.png"
                    alt="Making RPG - ir para a página inicial"
                >

            </a>

        </div>


        <!-- MENU -->

        <header>
            <nav class="menu" aria-label="Menu principal">

                <button
                    class="menu-toggle"
                    id="menuToggle"
                    type="button"
                    aria-label="Abrir menu"
                    aria-expanded="false"
                    aria-controls="menuLista"
                >
                    <span class="icone-menu" aria-hidden="true">☰</span>
                    <span class="texto-menu">Menu</span>
                </button>

                <ul id="menuLista">

                    <li>
                        <a href="fichas.html">Fichas</a>
                    </li>

                    <img src="img/decor_menu.png" class="decor" alt="">

                    <li>
                        <a href="campanhas.html">Campanhas</a>
                    </li>

                    <img src="img/decor_menu.png" class="decor" alt="">

                    <li>
                        <a href="mapas.html">Mapas</a>
                    </li>

                    <img src="img/decor_menu.png" class="decor" alt="">

                    <li>
                        <a href="missoes.html" aria-current="page">Missões</a>
                    </li>

                </ul>

            </nav>
        </header>

        <div class="titulo">
        <h1>Missões</h1>
        </div>

        <!-- CONTEÚDO DAS MISSÕES -->

        <main class="container-principal-missoes">


            <!-- LISTA DE MISSÕES -->

            <section
                class="lista-missoes"
                id="listaMissoes"
            >

            </section>


            <!-- BOTÕES -->

            <div class="acoes-principais">


                <!-- INSERIR MISSÃO -->

                <a
                    href="inserir-missoes.html"
                    class="botao-acao"
                >
                    inserir missão
                </a>



            </div>


        </main>


        <!-- MODAL DE DETALHES -->

        <div
            class="modal-overlay"
            id="modalDetalhes"
        >


            <div class="modal">


                <!-- BOTÃO FECHAR -->

                <button
                    class="fechar-modal"
                    id="fecharModal"
                >
                    ×
                </button>


                <!-- NOME -->

                <h2 id="detalheNome"></h2>

                <input type="text" id="editarNome" class="editar-nome"
                       maxlength="80" aria-label="Nome da missão" hidden>


                <!-- INFORMAÇÕES -->

                <div class="detalhes-conteudo">

                    <p>
                        <strong>História:</strong>
                        <span id="detalheDescricao"></span>
                        <textarea id="editarDescricao" class="editar-campo"
                                  aria-label="História da missão" hidden></textarea>
                    </p>

                    <p>
                        <strong>Objetivos:</strong>
                        <span id="detalheObjetivo"></span>
                        <textarea id="editarObjetivo" class="editar-campo"
                                  aria-label="Objetivos da missão" hidden></textarea>
                    </p>

                    <p>
                        <strong>Recompensas:</strong>
                        <span id="detalheRecompensas"></span>
                        <textarea id="editarRecompensas" class="editar-campo"
                                  aria-label="Recompensas da missão" hidden></textarea>
                    </p>

                </div>

                <div class="acoes-modal">
                    <button type="button" class="botao-edicao" id="botaoEditar">editar</button>
                    <span class="acoes-edicao" id="acoesEdicao" hidden>
                        <button type="button" class="botao-edicao" id="cancelarEdicao">cancelar</button>
                        <button type="button" class="botao-edicao principal" id="salvarEdicao">salvar</button>
                    </span>
                </div>

            </div>


        </div>


        <!-- LATERAL DIREITA -->

        <div class="lateral"></div>


    </div>


    <!-- JAVASCRIPT -->

    <script src="missoes.js"></script>


    <script src="menu.js" defer></script>

    <!-- VLibras -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget(
            'https://vlibras.gov.br/app',
            'https://vlibras.gov.br/config/default_logo.json',
            'random',
            'R'
        );
    </script>


    <footer class="footer">
        <span>© 2026 Making RPG Project. Todos os direitos reservados.</span>
        <span class="footer__sep"><img src="img/decor_menu.png" alt=""></span>
        <a href="https://mail.google.com/mail/?view=cm&to=tccmakingrpgproject@gmail.com" target="_blank" rel="noopener">
            <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7l9 6 9-6"/>
            </svg>
            tccmakingrpgproject@gmail.com
        </a>
    </footer>

</body>

</html>
