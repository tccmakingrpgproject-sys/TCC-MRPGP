<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light only">

    <link rel="stylesheet" href="mapas.css">
    <link rel="stylesheet" href="padrao-acessibilidade.css">
    <link rel="stylesheet" href="responsivo.css">

    <title>Inserir Mapa</title>

    <link rel="stylesheet" href="menu-ajuste.css">
    <link rel="icon" type="image/png" sizes="512x512" href="img/favicon-making-rpg.png">
    <link rel="stylesheet" href="identidade-global.css">
</head>

<body>

    <div class="container">

        <div class="lateral"></div>

        <div class="logo">
            <a href="index.html">
                <img src="img/Cópia de MAKING RPG.png"
                     alt="Making RPG - ir para a página inicial">
            </a>
        </div>

        <header>
            <nav class="menu" aria-label="Menu principal">

                <button class="menu-toggle" id="menuToggle" type="button"
                        aria-label="Abrir menu" aria-expanded="false"
                        aria-controls="menuLista">
                    <span class="icone-menu" aria-hidden="true">☰</span>
                    <span class="texto-menu">Menu</span>
                </button>

                <ul id="menuLista">
                    <li><a href="fichas.html">Fichas</a></li>
                    <img src="img/decor_menu.png" class="decor" alt="">
                    <li><a href="campanhas.html">Campanhas</a></li>
                    <img src="img/decor_menu.png" class="decor" alt="">
                    <li><a href="mapas.html" aria-current="page">Mapas</a></li>
                    <img src="img/decor_menu.png" class="decor" alt="">
                    <li><a href="missoes.html">Missões</a></li>
                </ul>

            </nav>
        </header>

        <div class="titulo">
            <h1>Inserir Mapa</h1>
        </div>

        <main class="container-principal-mapas">

            <form id="formMapa" class="form-mapa">

                <div class="campo">
                    <label for="imagem">Imagem do mapa</label>
                    <input type="file" id="imagem" accept="image/*" required>
                    <div class="previa-imagem" id="previaImagem">
                        <span>Nenhuma imagem selecionada</span>
                    </div>
                </div>

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" maxlength="60" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="5" maxlength="500" required></textarea>
                </div>

                <div class="acoes-form">
                    <a href="mapas.html" class="botao-salvar">cancelar</a>
                    <button type="submit" class="botao-salvar">salvar mapa</button>
                </div>

            </form>

        </main>

        <div class="lateral"></div>

    </div>

    <script src="mapas.js"></script>
    <script src="menu.js" defer></script>

    <!-- VLibras -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget(
            'https://vlibras.gov.br/app',
            'https://vlibras.gov.br/config/default_logo.json',
            'random',
            'R'
        );
    </script>


    <footer class="footer">
        <span>© 2026 Making RPG Project. Todos os direitos reservados.</span>
        <span class="footer__sep"><img src="img/decor_menu.png" alt=""></span>
        <a href="https://mail.google.com/mail/?view=cm&to=tccmakingrpgproject@gmail.com" target="_blank" rel="noopener">
            <svg class="footer__icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="M3 7l9 6 9-6"/>
            </svg>
            tccmakingrpgproject@gmail.com
        </a>
    </footer>

</body>

</html>
