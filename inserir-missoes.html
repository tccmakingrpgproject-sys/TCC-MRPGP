                </ul>

        </header>

    <div class="titulo-pre">
        <h1>Inserir Missão</h1>
    </div>

    <main class="mission-card">

        <div class="mission-body">

            <!-- NOME DA MISSÃO -->
            <div class="campo">
                <label for="missionName">Nome da missão</label>
                <input
                    type="text"
                    id="missionName"
                    class="mission-name"
                    placeholder="Digite o nome da missão"
                    autocomplete="off"
                >
            </div>

            <!-- HISTÓRIA -->
            <div class="campo">
                <label for="history">História da missão</label>
                <textarea
                    id="history"
                    class="mission-input"
                    autocomplete="off"
                    placeholder="Escreva a história da missão"
                    spellcheck="true"
                ></textarea>
            </div>

            <!-- OBJETIVOS -->
            <div class="campo">
                <label for="objectives">Objetivos da missão</label>
                <textarea
                    id="objectives"
                    class="mission-input"
                    autocomplete="off"
                    placeholder="Escreva os objetivos da missão"
                    spellcheck="true"
                ></textarea>
            </div>

            <!-- RECOMPENSAS -->
            <div class="campo">
                <label for="rewards">Recompensas da missão</label>
                <textarea
                    id="rewards"
                    class="mission-input"
                    autocomplete="off"
                    placeholder="Escreva as recompensas ganhas após a conclusão da missão"
                    spellcheck="true"
                ></textarea>
            </div>

        </div>

        <div class="acoes-form">
            <a href="missoes.html" id="cancelarMissao" class="botao-salvar">Cancelar</a>
            <button type="button" id="salvarMissao" class="botao-salvar">Salvar</button>
        </div>

    </main>

</div>
